# Preset: Claude Code + Kiro (recommended)
tools: both
level: 2

files:
  # Layer 1: Universal (shared bridge)
  - target: AGENTS.md
    template: universal/agents-md/standard

  # Layer 2: Claude Code adapter
  - target: CLAUDE.md
    template: claude-code/CLAUDE.md.template

  # Layer 2: Kiro adapter
  - target: .kiro/steering/product.md
    template: kiro/steering/product.md.template
  - target: .kiro/steering/tech.md
    template: kiro/steering/tech.md.template
  - target: .kiro/steering/structure.md
    template: kiro/steering/structure.md.template

  # Layer 3: Claude Code hooks
  - target: .claude/hooks/require-tests.sh
    template: claude-code/hooks/stop/require-tests.sh
  - target: .claude/hooks/block-destructive.sh
    template: claude-code/hooks/pre-tool-use/block-destructive.sh
  - target: .claude/hooks/auto-lint.sh
    template: claude-code/hooks/post-tool-use/auto-lint.sh

  # Knowledge base
  - target: docs/ARCHITECTURE.md
    template: universal/knowledge-base/docs/ARCHITECTURE.md
